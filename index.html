<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#112c38"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>T.R.M. 3D</title><style>body{margin:0;background:#0c1e29;color:#e8f6f4;font:16px system-ui}header{padding:18px;background:#163543}h1{margin:0;font-size:24px}main{display:grid;gap:16px;padding:16px;max-width:1100px;margin:auto}.panel{background:#17313e;border:1px solid #40606b;border-radius:15px;padding:16px}label{display:block;margin:12px 0}input{display:block;width:100%;box-sizing:border-box;background:#0b202a;color:white;border:1px solid #66828b;padding:12px;border-radius:8px;font-size:17px}button{border:0;background:#47c9b3;color:#08242a;padding:12px;border-radius:8px;font-weight:700;margin:3px}svg{width:100%;background:#fff;border-radius:10px}small{color:#b8d4d8}#msg{color:#b8d4d8}@media(min-width:800px){main{grid-template-columns:280px 1fr}}</style></head><body><header><h1>T.R.M. 3D</h1><small>Studio de plans techniques — prototype 0.1</small></header><main><section class="panel"><h2>Pièce rectangulaire</h2><label>Longueur (cm)<input id="l" type="number" value="400" min="50"></label><label>Largeur (cm)<input id="w" type="number" value="320" min="50"></label><label>Hauteur (cm)<input id="h" type="number" value="250" min="100"></label><button id="refresh">Actualiser</button><button id="save">Enregistrer</button><button id="export">Exporter SVG</button><p id="msg"></p><small>Les cotes proviennent exclusivement de tes mesures. Les photos et les croquis seront intégrés dans une version ultérieure.</small></section><section class="panel"><button id="b2">Plan 2D</button><button id="b3">Vue 3D</button><svg id="view" viewBox="0 0 700 550" xmlns="http://www.w3.org/2000/svg"></svg></section></main><script>const $=id=>document.getElementById(id),S=$('view'),N='http://www.w3.org/2000/svg';let mode=2;function e(t,a={},v){let n=document.createElementNS(N,t);for(let k in a)n.setAttribute(k,a[k]);if(v!==undefined)n.textContent=v;S.append(n);return n}function line(a,b,c,d){e('line',{x1:a,y1:b,x2:c,y2:d,stroke:'#24424d','stroke-width':2})}function text(x,y,t,extra={}){e('text',{x,y,fill:'#193b48','font-size':17,'text-anchor':'middle',...extra},t)}function draw(){let L=+$('l').value,W=+$('w').value,H=+$('h').value;if(![L,W,H].every(Number.isFinite)||L<50||W<50||H<100||L>3000||W>3000||H>600){$('msg').textContent='Dimensions invalides';return}S.replaceChildren();if(mode===2){let s=Math.min(490/L,350/W),x=(700-L*s)/2,y=(550-W*s)/2,a=L*s,b=W*s;e('rect',{x,y,width:a,height:b,fill:'#e3f0ef',stroke:'#193b48','stroke-width':7});line(x,y-30,x+a,y-30);line(x,y-37,x,y-23);line(x+a,y-37,x+a,y-23);text(x+a/2,y-40,L+' cm');line(x-35,y,x-35,y+b);line(x-42,y,x-28,y);line(x-42,y+b,x-28,y+b);text(x-48,y+b/2,W+' cm',{transform:'rotate(-90 '+(x-48)+' '+(y+b/2)+')'});text(350,530,'Plan coté — dimensions extérieures')}else{let s=Math.min(.72,380/(L+W)),p=(x,y,z)=>[350+(x-y)*s*.85,350+(x+y)*s*.38-z*s*.9],poly=(pts,fill)=>e('polygon',{points:pts.map(q=>p(...q).join(',')).join(' '),fill,stroke:'#294d59','stroke-width':2});poly([[0,0,0],[L,0,0],[L,W,0],[0,W,0]],'#e0edeb');poly([[0,0,0],[L,0,0],[L,0,H],[0,0,H]],'#c3d6db');poly([[0,0,0],[0,W,0],[0,W,H],[0,0,H]],'#a9c5cb');text(350,525,L+' × '+W+' × '+H+' cm — volume schématique')} $('msg').textContent='Surface : '+(L*W/10000).toFixed(2)+' m² · Volume : '+(L*W*H/1e6).toFixed(2)+' m³'}$('refresh').onclick=draw;$('b2').onclick=()=>{mode=2;draw()};$('b3').onclick=()=>{mode=3;draw()};$('save').onclick=()=>{localStorage.setItem('trm3d',JSON.stringify([$('l').value,$('w').value,$('h').value]));$('msg').textContent='Enregistré sur cet appareil'};$('export').onclick=()=>{draw();let u=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(S)],{type:'image/svg+xml'})),a=document.createElement('a');a.href=u;a.download='plan-TRM3D.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};try{let a=JSON.parse(localStorage.getItem('trm3d'));if(a)[$('l').value,$('w').value,$('h').value]=a}catch{}draw();</script></body></html>
